<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/statement-generator-theme.css') }}">
<style>
  /* Page-specific: centered error sheet.
     Shared tokens, fonts, .btn, .sheet, .seal-mark, .hint
     all live in statement-generator-theme.css */

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .error-sheet{
    max-width:420px;
    width:100%;
    text-align:center;
    padding:44px 36px 36px;
  }
  .void-mark{
    width:64px; height:64px;
    margin:0 auto 22px;
    border-radius:50%;
    font-size:20px;
    font-weight:600;
    transform:rotate(-6deg);
    border-color:var(--bad);
    color:var(--bad);
  }
  .error-sheet .eyebrow{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .error-sheet h1{
    font-size:30px;
    letter-spacing:-0.01em;
    margin:0 0 14px;
  }
  .error-sheet p{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 26px;
  }
</style>
</head>
<body>

<div class="sheet error-sheet">
  <div class="void-mark seal-mark">404</div>
  <p class="eyebrow">Filed in error</p>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for has been moved, renamed, or was never here.</p>
  <a href="/" class="btn btn-primary">Back to home</a>
</div>

</body>
</html>
