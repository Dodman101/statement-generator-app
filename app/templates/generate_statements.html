<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statement Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .success {
        color: green;
    }
    .error {
        color: red;
    }
</style>
<body>
    <!-- Flash Messages Display -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <ul>
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% endwith %}
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h2>Statement Generator</h2>
            </div>
            <div class="card-body">
                <form id="generate-form" action="/api/process_statement" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="template_file" class="form-label">Upload Template File:</label>
                        <input type="file" accept=".doc, .docx" class="form-control" id="template_file" name="template_file" required>
                    </div>

                    <div class="mb-3">
                        <label for="data_file" class="form-label">Upload Data File:</label>
                        <input type="file" accept=".xls, .xlsx" class="form-control" id="data_file" name="data_file" required>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="password_protection" name="password_protection">
                        <label class="form-check-label" for="password_protection">
                            Enable Password Protection
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Generate Statements</button>
                    </div>
                </form>

                <!-- Display progress status -->
                <div id="progress-section" class="mt-4" style="display:none;">
                    <p id="progress-message" class="text-info"></p>
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>

                <!-- Display the download link after processing -->
                <div id="download-section" class="mt-4" style="display:none;">
                    <p>Statements are ready for download! <a id="download-link" href="#">Download Now</a></p>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('generate-form').addEventListener('submit', function(event) {
            event.preventDefault();
    
            // Hide previous sections and show the progress section
            document.getElementById('download-section').style.display = 'none';
            document.getElementById('progress-section').style.display = 'block';
            document.getElementById('progress-message').textContent = 'Processing started...';
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-bar').setAttribute('aria-valuenow', '0');
    
            var formData = new FormData(this);
    
            fetch('/api/process_statement', {
                method: 'POST',
                body: formData,
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Response from /api/process_statement:', data);
    
                if (data.temp_id) {
                    const tempId = data.temp_id;
    
                    // Start polling for progress
                    const statusUrl = `/api/progress/${tempId}`;
                    const downloadUrl = `/api/download_statement/${tempId}`;
                    const pollInterval = 2000; // Poll every 2 seconds
                    let retries = 0;
                    const maxRetries = 20;
    
                    const pollStatus = setInterval(() => {
                        if (retries >= maxRetries) {
                            clearInterval(pollStatus);
                            document.getElementById('progress-message').textContent = 'Processing timeout. Please try again.';
                            alert('Processing took too long. Please try again.');
                            return;
                        }
                        retries++;

                        fetch(statusUrl)
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error(`Status check failed: ${response.statusText}`);
                                }
                                return response.json();
                            })
                            .then(statusData => {
                                console.log('Status response:', statusData);

                                if (statusData.status === 'Processing') {
                                    document.getElementById('progress-message').textContent = 'Processing statements...';

                                    if (statusData.progress) {
                                        const progress = statusData.progress.replace('%', ''); // Extract numeric value
                                        document.getElementById('progress-bar').style.width = statusData.progress;
                                        document.getElementById('progress-bar').setAttribute('aria-valuenow', progress);
                                    }
                                } else if (statusData.status === 'Completed') {
                                    clearInterval(pollStatus); // Stop polling once completed
                                    document.getElementById('progress-message').textContent = 'Processing complete!';
                                    document.getElementById('progress-bar').style.width = '100%';
                                    document.getElementById('progress-bar').setAttribute('aria-valuenow', '100');
                                    document.getElementById('download-link').setAttribute('href', downloadUrl);
                                    document.getElementById('download-section').style.display = 'block';
                                } else if (statusData.status === 'Error') {
                                    clearInterval(pollStatus);
                                    document.getElementById('progress-message').textContent = 'An error occurred during processing.';
                                    alert('Error: ' + (statusData.message || 'Unknown error.'));
                                }
                            })
                            .catch(error => {
                                clearInterval(pollStatus);
                                console.error('Error checking status:', error);
                                document.getElementById('progress-message').textContent = 'Error checking processing status.';
                                alert('There was an issue tracking the processing status. Please try again.');
                            });
                    }, pollInterval);
                } else {
                    alert('Error generating statements: ' + (data.message || 'Unknown error.'));
                }
            })
            .catch(error => {
                console.error('Error in /api/process_statement:', error);
                alert('There was an issue processing your request. Please try again.');
            });
        });
    </script>    
</body>
</html>
