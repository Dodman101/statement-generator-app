<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statement Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h2>Statement Generator</h2>
            </div>
            <div class="card-body">
                <form action="/process_statement" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="template_file" class="form-label">Upload Template File:</label>
                        <input type="file" class="form-control" id="template_file" name="template_file" required>
                    </div>

                    <div class="mb-3">
                        <label for="data_file" class="form-label">Upload Data File:</label>
                        <input type="file" class="form-control" id="data_file" name="data_file" required>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="password_protection" name="password_protection">
                        <label class="form-check-label" for="password_protection">
                            Enable Password Protection
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Generate Statements</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
