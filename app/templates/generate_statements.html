<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statement Generator</title>
    <link type="image/png" sizes="16x16" rel="icon" href="{{ url_for('static', filename='img/icons8-website-clouds-16.png') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .success { color: green; }
        .error { color: red; }
        #progress-bar { transition: width 0.4s ease; }
    </style>
</head>
<body>
    <!-- Flash Messages Display -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <ul>
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% endwith %}
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h2>Statement Generator</h2>
            </div>
            <div class="card-body">
                <form id="generate-form" action="/api/process_statement" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="template_file" class="form-label">Upload Template File:</label>
                        <input type="file" accept=".doc, .docx" class="form-control" id="template_file" name="template_file" required>
                    </div>

                    <div class="mb-3">
                        <label for="data_file" class="form-label">Upload Data File:</label>
                        <input type="file" accept=".xls, .xlsx" class="form-control" id="data_file" name="data_file" required>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="password_protection" name="password_protection">
                        <label class="form-check-label" for="password_protection">
                            Enable Password Protection
                        </label>
                    </div>

                    <div id="form-error" class="alert alert-danger" style="display:none;"></div>

                    <div class="d-grid">
                        <button type="submit" id="submit-btn" class="btn btn-success">Generate Statements</button>
                    </div>
                </form>

                <!-- Display progress status -->
                <div id="progress-section" class="mt-4" style="display:none;">
                    <p id="progress-message" class="text-info"></p>
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>

                <!-- Display the download link after processing -->
                <div id="download-section" class="mt-4" style="display:none;">
                    <p class="success">Statements are ready for download! <a id="download-link" href="#">Download Now</a></p>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const form = document.getElementById('generate-form');
        const submitBtn = document.getElementById('submit-btn');
        const formError = document.getElementById('form-error');
        const progressSection = document.getElementById('progress-section');
        const progressMessage = document.getElementById('progress-message');
        const progressBar = document.getElementById('progress-bar');
        const downloadSection = document.getElementById('download-section');
        const downloadLink = document.getElementById('download-link');

        // How long we keep polling before giving up on a job that never
        // reports back (network dropped, server restarted, etc). Individual
        // fetch failures don't count against this - only sustained silence does.
        const MAX_POLL_MINUTES = 10;
        const POLL_INTERVAL_MS = 1500;
        const MAX_CONSECUTIVE_FETCH_FAILURES = 5;

        function setProgress(percent, message) {
            const pct = Math.max(0, Math.min(100, Math.round(percent)));
            progressBar.style.width = pct + '%';
            progressBar.setAttribute('aria-valuenow', pct);
            progressMessage.textContent = message;
        }

        function resetUI() {
            formError.style.display = 'none';
            downloadSection.style.display = 'none';
            progressSection.style.display = 'block';
            setProgress(0, 'Starting...');
        }

        function showError(message) {
            progressSection.style.display = 'none';
            formError.textContent = message;
            formError.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Generate Statements';
        }

        function pollProgress(tempId, downloadUrl) {
            const startTime = Date.now();
            let consecutiveFailures = 0;

            const interval = setInterval(() => {
                if (Date.now() - startTime > MAX_POLL_MINUTES * 60 * 1000) {
                    clearInterval(interval);
                    showError('This is taking much longer than expected. The job may still finish in the background - try refreshing in a few minutes, or start again.');
                    return;
                }

                fetch(`/api/progress/${tempId}`)
                    .then(response => {
                        if (!response.ok && response.status !== 404) {
                            throw new Error(`Status check failed: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        consecutiveFailures = 0;

                        if (data.state === 'processing') {
                            setProgress(data.progress || 0, data.message || 'Processing...');
                        } else if (data.state === 'completed') {
                            clearInterval(interval);
                            setProgress(100, data.message || 'Done!');
                            progressSection.style.display = 'none';
                            downloadLink.setAttribute('href', downloadUrl);
                            downloadSection.style.display = 'block';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Generate Statements';
                        } else if (data.state === 'error' || data.state === 'unknown') {
                            clearInterval(interval);
                            showError(data.message || 'Something went wrong while generating your statements.');
                        }
                    })
                    .catch(error => {
                        consecutiveFailures++;
                        console.error('Error checking status:', error);
                        if (consecutiveFailures >= MAX_CONSECUTIVE_FETCH_FAILURES) {
                            clearInterval(interval);
                            showError('Lost connection while checking progress. Please refresh and try again.');
                        }
                    });
            }, POLL_INTERVAL_MS);
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            resetUI();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Starting...';

            const formData = new FormData(this);

            fetch('/api/process_statement', {
                method: 'POST',
                body: formData,
            })
                .then(response => response.json().then(data => ({ ok: response.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok || !data.temp_id) {
                        showError(data.message || 'Could not start processing. Please check your files and try again.');
                        return;
                    }
                    submitBtn.textContent = 'Generating...';
                    setProgress(0, data.message || 'Processing started...');
                    pollProgress(data.temp_id, data.download_link || `/api/download_statement/${data.temp_id}`);
                })
                .catch(error => {
                    console.error('Error in /api/process_statement:', error);
                    showError('There was an issue starting the request. Please try again.');
                });
        });
    </script>
</body>
</html>
