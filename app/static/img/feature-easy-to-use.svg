<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Document with a filled-in placeholder">
  <style>
    .ink{stroke:#16213e;}
    .ink-soft{stroke:#4c5674;}
    .seal{fill:#a9792c;}
    .seal-line{stroke:#8a6220;}
  </style>
  <circle cx="100" cy="100" r="92" fill="#faf9f4" class="seal-line" stroke-width="2"/>

  <!-- document -->
  <path d="M64 52 H118 L138 72 V148 A6 6 0 0 1 132 154 H64 A6 6 0 0 1 58 148 V58 A6 6 0 0 1 64 52 Z"
        fill="#ffffff" class="ink" stroke-width="3" stroke-linejoin="round"/>
  <path d="M118 52 V68 A4 4 0 0 0 122 72 H138" fill="none" class="ink" stroke-width="3" stroke-linejoin="round"/>

  <!-- text lines -->
  <line x1="72" y1="90" x2="122" y2="90" class="ink-soft" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="104" x2="112" y2="104" class="ink-soft" stroke-width="5" stroke-linecap="round"/>

  <!-- filled placeholder chip -->
  <rect x="70" y="116" width="52" height="16" rx="3" fill="#a9792c" opacity="0.16"/>
  <rect x="70" y="116" width="52" height="16" rx="3" fill="none" class="seal-line" stroke-width="1.5"/>
  <text x="96" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#8a6220">name</text>

  <!-- seal checkmark badge -->
  <circle cx="138" cy="140" r="17" class="seal" stroke="#8a6220" stroke-width="1.5"/>
  <path d="M130 140 L136 146 L147 133" fill="none" stroke="#faf9f4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
